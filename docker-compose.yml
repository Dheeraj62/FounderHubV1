version: "3.8"

services:
  # MongoDB
  mongodb:
    image: mongo:7
    container_name: founderhub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 3

  # .NET Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: founderhub-api
    ports:
      - "5111:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - MongoDbSettings__ConnectionString=mongodb://mongodb:27017
      - MongoDbSettings__DatabaseName=FounderHubDb
      - JwtSettings__Secret=docker_dev_secret_key_must_be_long_enough_for_hmac_sha256
      - AIService__BaseUrl=http://ai:8000
      - AIService__Enabled=true
      - Cors__AllowedOrigins__0=http://localhost:4200
    depends_on:
      mongodb:
        condition: service_healthy

  # Python AI Matching Service
  ai:
    build:
      context: ./backend-ai
      dockerfile: Dockerfile
    container_name: founderhub-ai
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DATABASE_NAME=FounderHubDb
      - MODEL_NAME=all-MiniLM-L6-v2
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
